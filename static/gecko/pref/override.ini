browser.newtabpage.activity-stream.showSponsored = false
browser.newtabpage.activity-stream.showSponsoredTopSites = false
browser.newtabpage.activity-stream.feeds.section.topstories = false
browser.newtabpage.activity-stream.feeds.telemetry = false
browser.newtabpage.activity-stream.telemetry = false
browser.newtabpage.activity-stream.default.sites = ""
browser.topsites.useRemoteSetting = false
browser.topsites.contile.enabled = false
browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons = false
browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features = false

# AI chatbot sidebar and on-device ML features.
browser.ml.enable = false
browser.ml.chat.enabled = false
browser.ml.linkPreview.enabled = false
browser.tabs.groups.smart.enabled = false

# Privacy-preserving attribution and other ad measurement.
toolkit.telemetry.coverage.opt-out = true
toolkit.coverage.opt-out = true
toolkit.coverage.endpoint.base = ""

# Do not offer to save cards/addresses (stored unencrypted without a primary password).
extensions.formautofill.addresses.enabled = false
extensions.formautofill.creditCards.enabled = false

# --- Archwave look -------------------------------------------------------
# Dark everything, so the monochrome chrome theme (archwave-theme feature)
# sits on a dark base and pages that support dark mode follow it.
extensions.activeThemeID = "firefox-compact-dark@mozilla.org"
layout.css.prefers-color-scheme.content-override = 0
browser.theme.toolbar-theme = 0
browser.theme.content-theme = 0
browser.compactmode.show = true
browser.uidensity = 1
floorp.archwave.enabled = true

# Applied once per profile by NoranekoStartup unless the user already changed
# the default engine. Empty disables.
floorp.search.privateDefault = "DuckDuckGo"
