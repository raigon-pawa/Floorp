# This is a list of preferences that will override the default preferences for the application.
# The format is:
# <pref name> = <pref value>
# To lock a preference (prevent users from changing it), add '@' prefix to the pref name:
# @<pref name> = <pref value>

# Example:
# browser.startup.homepage = "https://www.google.com"
# @browser.startup.homepage = "https://www.google.com"  (Locked)
# browser.startup.homepage_override = true
# browser.version = 100

intl.locale.requested = ""
# Keep the pre-Nova browser and Firefox Home UI while Floorp's design features adapt.
browser.nova.enabled = false
browser.newtabpage.activity-stream.nova.enabled = false
app.feedback.baseURL = "https://docs.floorp.app/"
browser.toolbars.bookmarks.visibility = "newtab"
browser.startup.page = 3
# Release notes open a page that loads the Floorp blog; keep startup offline.
floorp.releaseNotes.mode = "disabled"
floorp.releaseNotes.choiceConfirmed = true
# Effective only when the verified macOS App Shim lifecycle backend is available.
floorp.browser.nativeApp.keepRunningAfterBrowserQuit = true

services.sync.engine.prefs = true
services.sync.engine.floorp-workspaces = true
services.sync.engine.floorp-workspaces-v2 = true
floorp.workspaces.containerSync.enabled = true
services.sync.prefs.sync.browser.newtabpage.activity-stream.feeds.snippets = false
services.sync.prefs.sync.browser.newtabpage.activity-stream.showSponsored = false
services.sync.prefs.sync.browser.newtabpage.activity-stream.showSponsoredTopSites = false
services.sync.telemetry.maxPayloadCount = "0"
services.sync.telemetry.submissionInterval = "0"
services.sync.prefs.sync.browser.startup.page = false
services.sync.prefs.sync.browser.tabs.warnOnClose = false

svg.context-properties.content.enabled = true

toolkit.legacyUserProfileCustomizations.stylesheets = true
browser.preferences.moreFromMozilla = false

browser.tabs.warnOnClose = false
browser.tabs.warnOnCloseOtherTabs = false
extensions.getAddons.showPane = false
xpinstall.signatures.required = false

toolkit.telemetry.archive.enabled = false
toolkit.telemetry.bhrPing.enabled = false
toolkit.telemetry.enabled = false
toolkit.telemetry.firstShutdownPing.enabled = false
toolkit.telemetry.geckoview.streaming = false
toolkit.telemetry.newProfilePing.enabled = false
toolkit.telemetry.pioneer-new-studies-available = false
toolkit.telemetry.reportingpolicy.firstRun = false
toolkit.telemetry.server = ""
toolkit.telemetry.shutdownPingSender.enabled = false
toolkit.telemetry.shutdownPingSender.enabledFirstSession = false
toolkit.telemetry.testing.overrideProductsCheck = false
toolkit.telemetry.unified = false
toolkit.telemetry.updatePing.enabled = false
dom.private-attribution.submission.enabled = false

app.shield.optoutstudies.enabled = false

privacy.trackingprotection.origin_telemetry.enabled = false
privacy.userContext.enabled = true
privacy.userContext.ui.enabled = true
trailhead.firstrun.branches = ""
extensions.webcompat-reporter.enabled = false

devtools.toolbox.host = "right"

extensions.htmlaboutaddons.recommendations.enabled = false
datareporting.policy.dataSubmissionEnabled = false
datareporting.healthreport.uploadEnabled = false

browser.search.separatePrivateDefault = true
browser.search.separatePrivateDefault.ui.enabled = true
browser.urlbar.update2.engineAliasRefresh = true

browser.taskbarTabs.enabled = true
browser.profiles.forceEnableRefresh = true
browser.tabs.splitView.enabled = true
floorp.splitView.dragToSplitCreate.enabled = false
floorp.tabs.hoverReload.enabled = false
floorp.tabs.inlineUrlEdit.enabled = false
floorp.tabstacks.enabled = false

floorp.splitView.config = "{\"layout\":\"horizontal\",\"maxPanes\":4}"
floorp.splitView.paneSizes = "{\"flexRatios\":[0.5,0.5],\"gridColRatio\":0.5,\"gridRowRatio\":0.5}"

floorp.os.enabled = false
floorp.os.hidden = true
floorp.mcp.enabled = false

floorp.tabstrip.wheelguard = 0

services.sync.prefs.sync.floorp.browser.note.memos = true

# --- Memory management ---------------------------------------------------
# Gecko keeps freed heap pages mapped and schedules GC/CC lazily, so resident
# memory stays high after long uptime. The idle-memory-reclaim feature runs an
# explicit minimizeMemoryUsage() after input inactivity, only when enabled.
floorp.memory.idleReclaim = "{\"enabled\":false,\"idleThresholdSec\":60,\"pollIntervalSec\":60,\"minIntervalSec\":300,\"minResidentMB\":400,\"reclaimOnGhostWindows\":true}"
# Native App Shim requires the source-built Runtime and bundled executable.
floorp.browser.nativeApp.appShim.enabled = false

# --- Privacy hardening ---------------------------------------------------
# Tuned to stay usable: no resistFingerprinting (it forces light mode, UTC and
# letterboxing), no history wiping on shutdown (session restore stays on).

# Floorp: never fetch the experiments manifest from updates.floorp.app.
floorp.experiments.participationPolicy = "never"

# Tracking protection: strict ETP (Total Cookie Protection, fingerprinter and
# cryptominer blocking, query stripping) plus Global Privacy Control.
# Every pref in browser.contentblocking.features.strict needs a matching
# default: Firefox compares them on startup and drops to "custom" otherwise.
browser.contentblocking.category = "strict"
privacy.trackingprotection.enabled = true
privacy.trackingprotection.socialtracking.enabled = true
privacy.trackingprotection.emailtracking.enabled = true
privacy.fingerprintingProtection = true
privacy.query_stripping.enabled = true
privacy.query_stripping.enabled.pbmode = true
privacy.globalprivacycontrol.enabled = true
privacy.donottrackheader.enabled = true
privacy.bounceTrackingProtection.mode = 1
network.cookie.cookieBehavior = 5
network.cookie.cookieBehavior.pbmode = 5
privacy.trackingprotection.pbmode.enabled = true
privacy.trackingprotection.cryptomining.enabled = true
privacy.trackingprotection.fingerprinting.enabled = true
privacy.trackingprotection.emailtracking.pbmode.enabled = true
privacy.trackingprotection.consentmanager.skip.enabled = false
privacy.trackingprotection.consentmanager.skip.pbmode.enabled = false
privacy.fingerprintingProtection.pbmode = true
privacy.annotate_channels.strict_list.enabled = true
network.http.referer.disallowCrossSiteRelaxingDefault = true
network.http.referer.disallowCrossSiteRelaxingDefault.top_navigation = true

# Referrers: send only the origin across sites.
network.http.referer.XOriginTrimmingPolicy = 2

# HTTPS-only everywhere, encrypted DNS (falls back to system DNS on failure).
dom.security.https_only_mode = true
dom.security.https_only_mode_send_http_background_request = false
network.trr.mode = 2
network.trr.uri = "https://dns.quad9.net/dns-query"
network.trr.custom_uri = "https://dns.quad9.net/dns-query"
network.dns.echconfig.enabled = true

# No speculative network traffic.
network.prefetch-next = false
network.dns.disablePrefetch = true
network.dns.disablePrefetchFromHTTPS = true
network.predictor.enabled = false
network.http.speculative-parallel-limit = 0
browser.urlbar.speculativeConnect.enabled = false
browser.places.speculativeConnect.enabled = false
browser.send_pings = false

# WebRTC: do not leak local IPs.
media.peerconnection.ice.default_address_only = true
media.peerconnection.ice.proxy_only_if_behind_proxy = true

# Mozilla background services.
app.normandy.enabled = false
app.normandy.api_url = ""
browser.ping-centre.telemetry = false
browser.discovery.enabled = false
browser.region.update.enabled = false
browser.region.network.url = ""
network.captive-portal-service.enabled = false
network.connectivity-service.enabled = false
captivedetect.canonicalURL = ""
extensions.getAddons.cache.enabled = false
browser.safebrowsing.downloads.remote.enabled = false
geo.provider.network.url = ""
geo.provider.use_gpsd = false
geo.provider.use_geoclue = false

# Crash reports.
breakpad.reportURL = ""
browser.tabs.crashReporting.sendReport = false
browser.crashReports.unsubmittedCheck.autoSubmit2 = false
browser.crashReports.unsubmittedCheck.enabled = false

