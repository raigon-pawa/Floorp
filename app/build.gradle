def baseVersionCode = generatedVersionCode

import com.android.build.api.variant.BuildConfigField
import com.android.build.api.variant.FilterConfiguration
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        if (variantBuilder.buildType == "release") {
            variantBuilder.enableUnitTest = true
        }
    }

    onVariants(selector().all()) { variant ->
        // -------------------------------------------------------------------------
        // 1. Official Build Flag
        // -------------------------------------------------------------------------
        boolean official = project.hasProperty("official") || gradle.hasProperty("localProperties.official")
        variant.buildConfigFields.put("MOZILLA_OFFICIAL",
                new BuildConfigField("Boolean", official.toString(), "Official Build"))

        // -------------------------------------------------------------------------
        // 2. Version Codes (Only if IS_RELEASED is true)
        // -------------------------------------------------------------------------
        // Note: In the new API, checking buildConfigFields defined in build types is harder.
        // We check the build type name directly instead.
        if (variant.buildType == "release") {
            // Logic adapted for new API
            def baseCode = baseVersionCode
            if (baseCode % 2 != 0) baseCode += 1 // Ensure even

            variant.outputs.each { output ->
                def abiFilter = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }                // Note: Accessing specific ABI names in AGP 9 via 'filters' can be tricky
                def abiName = abiFilter?.identifier // This returns "x86", "arm64-v8a", etc.

                // Simplified mapping for demonstration:
                def addedCode = 0
                if (abiName != null) {
                    // FIX: Check the abiName identifier instead of output.name
                    if (abiName == "x86_64") addedCode = 6
                    else if (abiName == "x86") addedCode = 4
                    else if (abiName == "arm64-v8a") addedCode = 2
                }

                output.versionCode.set(baseCode + addedCode)
            }
        }
    }
}

android {
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(Config.jvmTargetCompatibility)
        targetCompatibility = JavaVersion.toVersion(Config.jvmTargetCompatibility)
    }

    defaultConfig {
        applicationId "io.github.raigonpawa.archwave"
        buildToolsVersion Config.buildToolsVersion
        compileSdk {
            version = release(Config.compileSdkMajorVersion) {
                minorApiLevel = Config.compileSdkMinorVersion
            }
        }
        minSdkVersion Config.minSdkVersion
        targetSdkVersion Config.targetSdkVersion
        versionCode 1
        versionName Config.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    // Release signing: the keystore is named in local.properties (archwave.*) or the environment (ARCHWAVE_*),
    // neither of which is committed. Without one, release builds are signed with the debug key.
    // An empty value counts as not set, so a blank local.properties line does not hide the environment.
    def signingEnv = [storeFile: 'ARCHWAVE_STORE_FILE', storePassword: 'ARCHWAVE_STORE_PASSWORD',
                      keyAlias: 'ARCHWAVE_KEY_ALIAS', keyPassword: 'ARCHWAVE_KEY_PASSWORD']
    def signing = signingEnv.collectEntries { key, envName ->
        def localKey = "localProperties.archwave.${key}"
        [key, (gradle.hasProperty(localKey) ? gradle."${localKey}" : null) ?: System.getenv(envName)]
    }
    def releaseStoreFile = signing.storeFile
    if (releaseStoreFile) {
        // AGP would only fail after minification, and without naming the setting.
        def missing = signing.findAll { !it.value }.keySet().collect { "archwave.${it} / ${signingEnv[it]}" }
        if (missing) {
            throw new GradleException("Release signing: archwave.storeFile / ARCHWAVE_STORE_FILE is set but " +
                    "these are missing (local.properties key / environment variable): ${missing.join(', ')}")
        }
    }

    signingConfigs {
        if (releaseStoreFile) {
            archwave {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    def releaseTemplate = {
        minifyEnabled true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        signingConfig releaseStoreFile ? signingConfigs.archwave : signingConfigs.debug

        if (gradle.hasProperty("localProperties.debuggable")) {
            debuggable true
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release releaseTemplate >> {
            buildConfigField "boolean", "IS_RELEASED", "true"
        }
    }

    testOptions {
        execution = 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
    }

    lintOptions {
        lintConfig = file("lint.xml")
        disable 'GradleDependency', 'AndroidGradlePluginVersion'
    }

    splits {
        abi {
            enable = true

            reset()

            include "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    namespace = 'org.mozilla.reference.browser'
}

// Say so once, and only when a release is really being built, if it is signed with the debug key.
gradle.taskGraph.whenReady { graph ->
    def signsRelease = graph.allTasks.any { it.project == project && it.name == 'validateSigningRelease' }
    if (signsRelease && android.buildTypes.release.signingConfig.name == 'debug') {
        logger.warn("WARNING: no release keystore configured (archwave.storeFile in local.properties or " +
                "ARCHWAVE_STORE_FILE); this release build is signed with the DEBUG key. Do not distribute it.")
    }
}

