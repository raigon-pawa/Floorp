#
# Gecko prefs with no typed GeckoView setting. EngineProvider passes this file to the runtime builder, so these are
# default-branch prefs that exist before Gecko makes its first request. Never list a pref that GeckoRuntimeSettings or
# ContentBlocking manages (network.trr.*, dom.security.https_only_mode, privacy.*, network.cookie.*...): GeckoView
# would fight it. Remote Settings, Safe Browsing, add-on update checks and the add-on blocklist stay on.
prefs:
  # Speculative traffic: link prefetch, DNS prefetch, speculative connections, hyperlink-auditing pings
  network.prefetch-next: false
  network.dns.disablePrefetch: true
  network.dns.disablePrefetchFromHTTPS: true
  network.http.speculative-parallel-limit: 0
  network.early-hints.preconnect.enabled: false
  browser.send_pings: false
  # WebRTC: only the default route's address, and only the proxy when behind one (desktop Archwave values)
  media.peerconnection.ice.default_address_only: true
  media.peerconnection.ice.proxy_only_if_behind_proxy: true
  # Captive-portal and connectivity probes (firefox-portal-detection.com, example.org lookups)
  network.captive-portal-service.enabled: false
  network.connectivity-service.enabled: false
  captivedetect.canonicalURL: ""
  # HTTPS-only mode: no plain-HTTP background request to guess whether a site has HTTPS
  dom.security.https_only_mode_send_http_background_request: false
  # Cross-site referrers: origin only
  network.http.referer.XOriginTrimmingPolicy: 2
  # No AMO metadata lookups for the ids of installed add-ons (update checks stay on)
  extensions.getAddons.cache.enabled: false
  # No network region lookup
  browser.region.update.enabled: false
  browser.region.network.url: ""
  # Monochrome selection and find-in-page highlights, readable on dark and light pages
  ui.highlight: "#5c5c5c"
  ui.highlighttext: "#ffffff"
  ui.textHighlightBackground: "#5c5c5c"
  ui.textHighlightForeground: "#ffffff"
  ui.textSelectAttentionBackground: "#bdbdbd"
  ui.textSelectAttentionForeground: "#000000"
